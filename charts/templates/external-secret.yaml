apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: order-processor-db
  labels:
    app.kubernetes.io/name: order-processor
    # prettier-ignore
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: order-processor-db
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: Bitovi-Order-Processor-PW
        property: order-processor-db
