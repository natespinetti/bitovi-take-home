apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: order-processor-db
  labels:
    app.kubernetes.io/name: order-processor
    app.kubernetes.io/instance: { { .Release.Name } }

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: Bitovi-Order-Processor-PW
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: order-processor-db
        property: password
